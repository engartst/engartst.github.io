<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <link rel="stylesheet" href="formStyle.css" />
    <title>Upload Barcodes</title>
  </head>
  <body>
    <h1>Upload your barcode files below</h1>

    <div id="drop-area">
      <form class="my-form">
        <p>
          Upload multiple files with the file dialog or by dragging and dropping
          images onto the dashed region
        </p>
        <input
          type="file"
          id="fileElem"
          multiple
          accept="text/*"
          onchange="handleFiles(this.files)"
        />
        <label class="button" for="fileElem">Select some files</label>
      </form>
      <div id="gallery"></div>
      <!----------this is where I want to show to preview of the files uploaded----->
    </div>
    <p>This is where a preview of the file content will be...</p>

    <!--<input type="file" onchange="previewFile()" /><br />-->
    <p class="content"></p>

    <div class="preview" id="preview">
      <!--this is another attempt to show the contents of the uploaded file-->
    </div>

    <h2>Which library are you checking in the books?</h2>

    <select id="location">
      <option disabled selected value>-- select an option --</option>
      <option value="Bostock Library">Bostock</option>
      <option value="Perkins Library">Perkins</option>
      <option value="Rubenstein Library">Rubenstein</option>
    </select>
    <br />

    <h3>Checking into: <span class="output"></span></h3>

    <button class="button" onClick="submit(); this.disabled = true;">
      Submit barcodes
    </button>
    <!-------- <progress id="progress-bar" max="100" value="0"></progress> --->

    <script type="text/javascript">
      let uploadProgress = [];

      let progressBar = document.getElementById("progress-bar");

      function initializeProgress(numfiles) {
        progressBar.value = 0;
        filesDone = 0;
        filesToDo = numfiles;
      }

      function initializeProgress(numFiles) {
        progressBar.value = 0;
        uploadProgress = [];

        for (let i = numFiles; i > 0; i--) {
          uploadProgress.push(0);
        }
      }

      function updateProgress(fileNumber, percent) {
        uploadProgress[fileNumber] = percent;
        let total =
          uploadProgress.reduce((tot, curr) => tot + curr, 0) /
          uploadProgress.length;
        progressBar.value = total;
      }

      let dropArea = document.getElementById("drop-area");
      ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
        dropArea.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      ["dragenter", "dragover"].forEach((eventName) => {
        dropArea.addEventListener(eventName, highlight, false);
      });
      ["dragleave", "drop"].forEach((eventName) => {
        dropArea.addEventListener(eventName, unhighlight, false);
      });

      function highlight(e) {
        dropArea.classList.add("highlight");
      }

      function unhighlight(e) {
        dropArea.classList.remove("highlight");
      }

      dropArea.addEventListener("drop", handleDrop, false);

      function handleDrop(e) {
        let dt = e.dataTransfer;
        let files = dt.files;

        handleFiles(files);
      }
      function handleFiles(files) {
        files = [...files];
        initializeProgress(files.length);
        files.forEach(uploadFile);
        files.forEach(previewFile);
      }

      function uploadFile(file, i) {
        var url = "YOUR URL HERE";
        var xhr = new XMLHttpRequest();
        var formData = new FormData();
        xhr.open("POST", url, true);

        xhr.upload.addEventListener("progress", function (e) {
          updateProgress(i, (e.loaded * 100.0) / e.total || 100);
        });

        xhr.addEventListener("readystatechange", function (e) {
          if (xhr.readyState == 4 && xhr.status == 200) {
            // Done. Inform the user
          } else if (xhr.readyState == 4 && xhr.status != 200) {
            // Error. Inform the user
          }
        });

        formData.append("file", file);
        xhr.send(formData);
      }
      // this function needs to be reworked to not show preview of image but of text (see below)
      function previewFile(file) {
        let reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = function () {
          let img = document.createElement("img");
          img.src = reader.result;
          document.getElementById("gallery").appendChild(img);
        };
      }

      // testing
      function fileValidation() {
        var fileInput = document.getElementById("file");
        var filePath = fileInput.value;
        var allowedExtensions = /(\.txt)$/i;
        if (!allowedExtensions.exec(filePath)) {
          alert("Please upload file having extensions .txt only.");
          fileInput.value = "";
          return false;
        } else {
          //Image preview
          if (fileInput.files && fileInput.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
              document.getElementById("preview").innerHTML = "";
              document.getElementById("preview").append(e.target.result);
            };
            reader.readAsText(fileInput.files[0]);
          }
        }
      }

      function previewFile() {
        const content = document.querySelector(".content");
        const [file] = document.querySelector("input[type=file]").files;
        const reader = new FileReader();

        reader.addEventListener(
          "load",
          () => {
            // this will then display a text file
            content.innerText = reader.result;
          },
          false
        );

        if (file) {
          reader.readAsText(file);
        }
      }

      //testing above

      function submit() {
        selectElement = document.querySelector("#location");
        output = selectElement.options[selectElement.selectedIndex].value;
        document.querySelector(".output").textContent = output;
      }
    </script>
  </body>
</html>
